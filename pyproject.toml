[project]
name = "ai-security-assistant"
version = "0.1.0"
description = "Educational deterministic security analysis CLI with optional AI explanation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.1.0",
]

[project.scripts]
ai-security-assistant = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
